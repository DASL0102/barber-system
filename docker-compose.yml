services:
  db:
    image: postgres:16-alpine
    container_name: barber_postgres
    restart: always
    environment:
      POSTGRES_DB: barberia_db
      POSTGRES_USER: barber_user
      POSTGRES_PASSWORD: barber_secret_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber_user -d barberia_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barber_app
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: barberia_db
      DB_USER: barber_user
      DB_PASS: barber_secret_pass
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
